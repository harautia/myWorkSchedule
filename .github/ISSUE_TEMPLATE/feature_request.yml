name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation in the bar, e.g. "Managers can't see who is on holiday when planning".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: who
    attributes:
      label: Who needs it?
      multiple: true
      options:
        - Managers
        - Employees
        - Admins / self-hosters
