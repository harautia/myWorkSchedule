name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please don't use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a manager
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Hosted service
        - Self-hosted (Docker)
        - Self-hosted (other)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app footer, or the release tag / commit you run.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15, Chrome on Windows
